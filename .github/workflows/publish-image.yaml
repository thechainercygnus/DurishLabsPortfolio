name: Publish portfolio image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and publish to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Use a stable SemVer Git tag such as v1.0.0."
              exit 1
            fi
            tags+=("${GITHUB_REF_NAME#v}" latest)
          fi
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$image:$GITHUB_SHA" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            if [[ "$tag" != "$GITHUB_SHA" ]]; then
              docker tag "$image:$GITHUB_SHA" "$image:$tag"
            fi
            docker push "$image:$tag"
            printf 'Published `%s:%s`\n\n' "$image" "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
